spec_version: "0.1.0"
name: "personal-finance-tracker-agent"
version: "1.0.0"
description: >
  Autonomous personal finance and portfolio management intelligence agent.
  Ingests local transaction ledgers, tracks income and expenditure categories,
  evaluates stock asset allocations, and computes savings velocity with zero cloud retention.
author: "Chithra R"
license: "GPL-3.0"

model:
  preferred: "claude-3-5-sonnet-20241022"
  fallback:
    - "gpt-4o"
    - "gemini-2.0-flash"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - expense-budget-analyzer
  - investment-portfolio-tracker
  - cash-flow-forecaster
  - ledger-serialization-auditor

tools:
  - expense-analyzer
  - portfolio-evaluator
  - cashflow-projector
  - ledger-auditor

runtime:
  max_turns: 10
  temperature: 0.1
  timeout: 120

compliance:
  risk_tier: standard
  frameworks:
    - gdpr
    - pci-dss
  data_governance:
    pii_handling: redact
    data_classification: internal
  recordkeeping:
    audit_logging: true
    log_format: structured_json
  supervision:
    human_in_the_loop: conditional
    override_capability: true
    kill_switch: true

tags:
  - finance
  - personal-finance
  - expense-tracker
  - portfolio-management
  - budget-planning
  - zero-retention

metadata:
  domain: "finance"
  category: "Finance"
